name: Atualizar estoque pelo Dapic

on:
  push:
    paths:
      - 'estoque.pdf'
      - 'index.html'
      - 'atualizar_estoque.py'
      - 'requirements.txt'

permissions:
  contents: write

jobs:
  atualizar:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Instalar dependências
        run: pip install -r requirements.txt

      - name: Gerar estoque.json
        run: python atualizar_estoque.py

      - name: Publicar estoque atualizado
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add estoque.json
          if git diff --cached --quiet; then
            echo "Nenhuma alteração no estoque."
          else
            git commit -m "Atualizar estoque automaticamente"
            git push
          fi
